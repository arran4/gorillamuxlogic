# Canonical GitHub Actions CI/CD Super-Reference:
# https://arran4.github.io/blog/post/2026/043-canonical-github-actions-ci-cd-super-reference/
name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master]
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:
    inputs:
      allow_prs:
        description: "Allow PR creation for maintenance/fixes"
        required: false
        default: true
        type: boolean
      mode:
        description: "Pipeline mode"
        required: true
        default: "validate"
        type: choice
        options:
          - validate
          - lint-fix
          - release-major
          - release-minor
          - release-patch
          - release-test
          - release-rc
          - release-alpha
          - publish-tag
          - monthly-maintenance
      release_version_override:
        description: "Optional explicit release version (for example 2.4.0 or 2.4.0-rc.2)"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.event.inputs.mode, 'release-') }}

permissions:
  contents: read

jobs:
  route:
    name: Route Event
    runs-on: ubuntu-latest
    outputs:
      run_code_checks: ${{ steps.route.outputs.run_code_checks }}
      run_release: ${{ steps.route.outputs.run_release }}
      run_publisher: ${{ steps.route.outputs.run_publisher }}
      run_maintenance: ${{ steps.route.outputs.run_maintenance }}
      run_autofix: ${{ steps.route.outputs.run_autofix }}
      mode: ${{ steps.route.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF: ${{ github.ref }}
          SCHEDULE: ${{ github.event.schedule }}
        run: .github/scripts/route.sh

  autofix:
    name: Autofix Formatting
    needs: [route]
    if: ${{ needs.route.outputs.run_autofix == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go fmt ./...
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - run: golangci-lint run --fix
      - name: Create Pull Request
        if: ${{ github.event_name == 'schedule' || inputs.allow_prs != false }}
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "style: auto-format code and lint fixes"
          title: "style: auto-format code and lint fixes"
          branch: automation/lint-fix
          delete-branch: true

  maintenance:
    name: Monthly Maintenance
    needs: [route]
    if: ${{ needs.route.outputs.run_maintenance == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go get -u ./... && go mod tidy
      - run: go vet ./...
      - run: go test ./...
      - name: Create Pull Request
        if: ${{ github.event_name == 'schedule' || inputs.allow_prs != false }}
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(deps): update dependencies"
          title: "chore(deps): update dependencies"
          branch: automation/maintenance
          delete-branch: true

  gitleaks:
    name: Secret scan
    needs: [route]
    if: ${{ needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  go-checks:
    name: Go Tests and Checks
    needs: [route]
    if: ${{ needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.26', '1.27']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Format
        if: ${{ matrix.go-version == '1.27' }}
        run: |
          gofmt -s -w .
          git diff --exit-code
      - name: Vet
        if: ${{ matrix.go-version == '1.27' }}
        run: go vet ./...
      - name: Lint
        if: ${{ matrix.go-version == '1.27' }}
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run
      - name: Test
        run: go test ./...
      - name: Test CI routing and release logic
        if: ${{ matrix.go-version == '1.27' }}
        run: .github/scripts/test_ci.sh

  release-ready:
    name: Release Quality Gates Passed
    needs: [route, go-checks, gitleaks]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.route.result == 'success' &&
      (needs.route.outputs.run_code_checks != 'true' || (needs.gitleaks.result == 'success' && needs.go-checks.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - run: echo "All release quality gates passed."

  prepare-release-tag:
    name: Prepare Release Tag
    needs: [route, release-ready]
    if: ${{ needs.route.outputs.run_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install git-tag-inc
        uses: arran4/git-tag-inc-action@v1
        with:
          mode: install
      - name: Prepare and Push Release Tag
        env:
          TARGET_REF: ${{ github.ref }}
          TARGET_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_VERSION_OVERRIDE: ${{ inputs.release_version_override }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/prepare-release.sh

  publisher:
    name: Release Publisher
    needs: [route, release-ready]
    if: ${{ needs.route.outputs.run_publisher == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-test') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
